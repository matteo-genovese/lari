<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#010000">
<link rel="icon" href="assets/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<title>Lari — Lare</title>
<style>
  :root{
    --bg:#010000; --panel:#12151d; --line:#1e2330;
    --txt:#e8ecf4; --dim:#7b8496; --accent:#5ad1a5; --warn:#e0a458; --err:#e06c75;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{height:100%; margin:0}
  body{
    background:var(--bg); color:var(--txt);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex; flex-direction:column; align-items:center;
    padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 18px);
    user-select:none; -webkit-user-select:none;
  }
  header{width:100%; max-width:520px; display:flex; justify-content:space-between; align-items:center}
  h1{font-size:15px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--dim); margin:0}
  .conn{font-size:12px; color:var(--dim); display:flex; gap:6px; align-items:center}
  .dot{width:8px; height:8px; border-radius:50%; background:var(--err); display:inline-block}
  .dot.on{background:var(--accent)}

  .stage{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; width:100%}
  .orb{
    width:200px; height:253px; flex:none; position:relative;
    display:flex; align-items:center; justify-content:center;
  }
  .lare-sprite{
    position:absolute; inset:0;
    background:url("assets/lare-idle.svg") center / contain no-repeat;
  }
  .orb .label{position:absolute; bottom:-18px; width:100%; font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); text-align:center}
  .orb.listening .lare-sprite,.orb.waking .lare-sprite,.orb.recording .lare-sprite{background-image:url("assets/lare-listening.svg")}
  .orb.transcribing .lare-sprite,.orb.thinking .lare-sprite{background-image:url("assets/lare-thinking.svg")}
  .orb.speaking .lare-sprite{background-image:url("assets/lare-speaking.svg")}
  .orb.error .lare-sprite{background-image:url("assets/lare-error.svg")}

  .meter{width:190px; height:6px; border-radius:4px; background:var(--panel); overflow:hidden; border:1px solid var(--line)}
  .meter i{display:block; height:100%; width:0%; background:var(--accent); transition:width .1s linear}
  .usage{max-width:min(100%,360px); min-height:36px; padding:8px 13px; border-radius:10px; border:1px solid var(--line); background:var(--panel); color:var(--dim); text-align:center; font-size:11px; letter-spacing:.04em; line-height:1.4}
  .usage.local{color:var(--accent); border-color:#265a48}
  .usage.followup,.usage.pending{color:var(--warn); border-color:#635030}
  .usage.paid{color:#fff; border-color:var(--err); background:#4b2026}
  .month{width:100%; max-width:min(100%,360px); margin-top:6px; color:var(--dim); font-size:10px; letter-spacing:.06em; text-align:center}

  .log{width:100%; max-width:520px; max-height:34vh; overflow-y:auto; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:10px 12px}
  .log:empty::before{content:"No conversation yet."; color:var(--dim); font-size:13px}
  .turn{padding:7px 0; border-bottom:1px solid var(--line); font-size:14.5px}
  .turn:last-child{border-bottom:0}
  .who{font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--dim); margin-bottom:2px}
  .who.me{color:var(--accent)}
  .err-line{color:var(--err); font-size:13px}

  .cta{width:100%; max-width:520px; display:flex; flex-direction:column; gap:10px}
  .cta .pair{display:flex; gap:10px}
  .cta .pair button{flex:1; min-width:0; padding:17px 8px}
  button{
    width:100%; padding:17px; border-radius:14px; border:1px solid var(--line);
    background:var(--accent); color:#06120d; font-size:16px; font-weight:700; cursor:pointer;
  }
  .ptt{background:var(--accent); touch-action:none; user-select:none}
  .ptt.held{background:var(--warn)}
  button.ghost{background:transparent; color:var(--dim); font-weight:500; border-color:var(--line)}
  button:active{transform:scale(.99)}
  .hint{font-size:12.5px; color:var(--dim); text-align:center}
  .hidden{display:none !important}
</style>
</head>
<body>
  <header>
    <h1>Lare</h1>
    <div class="conn"><span class="dot" id="dot"></span><span id="connTxt">disconnected</span></div>
  </header>

  <div class="stage">
    <div class="orb idle" id="orb" role="img" aria-label="Lare"><div class="lare-sprite" aria-hidden="true"></div><div class="label" id="label">idle</div></div>
    <div class="meter"><i id="meterBar"></i></div>
    <div class="usage" id="usageStatus" role="status" aria-live="polite">DISCONNECTED · no audio sent to ElevenLabs</div>
  </div>

  <div class="log" id="log"></div>

  <div class="cta" style="margin-top:14px">
    <div id="talkPair" class="pair hidden">
      <button id="pttBtn" class="ptt hidden" type="button">Hold to talk</button>
      <button id="tapBtn" class="ptt hidden" type="button">Tap to talk</button>
    </div>
    <button id="startBtn">Start listening</button>
    <button id="stopBtn" class="ghost hidden">Stop</button>
    <button id="interruptBtn" class="ghost hidden">Stop response</button>
    <div class="hint" id="hint">Start listening to load the configured wake phrase.</div>
    <div class="month" id="monthUsage"></div>
  </div>

<script>
(() => {
  const TOKEN = location.pathname.split("/")[1] || "";
  const WS_URL = `${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/${TOKEN}/ws`;

  const $ = id => document.getElementById(id);
  const orb = $("orb"), label = $("label"), log = $("log"), dot = $("dot"), connTxt = $("connTxt");
  const startBtn = $("startBtn"), stopBtn = $("stopBtn"), interruptBtn = $("interruptBtn");
  const pttBtn = $("pttBtn"), tapBtn = $("tapBtn"), talkPair = $("talkPair");
  let pttHeld = false, tapArmed = false, turnIsManual = false;
  const meterBar = $("meterBar"), hint = $("hint"), usageStatus = $("usageStatus");

  let ws = null, ctx = null, stream = null, processor = null, source = null;
  let running = false, wakeLock = null;
  let connected = false, currentState = "idle", sttMode = null, sttTurn = null;
  let paidAudioThisTurn = false, followupUntil = 0, turnIsFollowup = false;
  let partialTurn = null, partialNode = null;
  let playing = false;   // Mute capture during the response to prevent echo.
  let wakePhrase = "";   // supplied by the bridge, never inferred from branding
  let reconnectTries = 0, reconnectTimer = null;
  let speakingTurn = null, lastPlaybackTurn = null;
  let interruptPendingTurn = null;
  const playback = {
    mode: null, turn: null, nextSeq: 0, awaiting: null, queue: [],
    active: null, activeUrl: null, ended: false, completionScheduled: false,
    releaseTimer: null, generation: 0
  };
  const states = {
    listening:"listening", waking:"wake detected", recording:"speak", transcribing:"transcribing",
    thinking:"thinking", speaking:"speaking", idle:"idle", error:"error"
  };

  function renderUsage(){
    let tone = "local", text;
    const remaining = Math.ceil((followupUntil - Date.now()) / 1000);
    if (followupUntil && remaining <= 0){
      followupUntil = 0;
      if (!tapArmed && connected && currentState === "listening" && wakePhrase){
        hint.textContent = `Say “${wakePhrase}” to talk.`;
      }
    }
    if (!connected){
      tone = "";
      text = "DISCONNECTED · no audio sent to ElevenLabs";
    } else if (["waking", "recording", "transcribing"].includes(currentState)){
      const phase = turnIsManual ? "MANUAL" : turnIsFollowup ? "FOLLOW-UP" : "POST-WAKE";
      if (sttMode === "realtime"){
        tone = "paid";
        text = currentState === "transcribing"
          ? "ELEVENLABS · transcribing (audio already sent)"
          : "ELEVENLABS · AUDIO SENT (credits)";
      } else if (sttMode === "local"){
        text = paidAudioThisTurn
          ? `${phase} · AUDIO ALREADY SENT; now LOCAL STT (no new audio)`
          : `${phase} · LOCAL STT, nothing sent to ElevenLabs`;
      } else {
        tone = "pending";
        text = `${phase} · STT STARTING, COST NOT CONFIRMED`;
      }
    } else if (currentState === "listening" && remaining > 0){
      tone = "followup";
      text = `FOLLOW-UP · LOCAL now; ElevenLabs if you speak (${remaining}s)`;
    } else if (currentState === "listening"){
      text = "PRE-WAKE · LOCAL ONLY; ElevenLabs idle";
    } else {
      tone = "";
      text = "NO AUDIO being sent to ElevenLabs";
    }
    usageStatus.className = "usage " + tone;
    usageStatus.textContent = text;
    if (currentState === "listening" && connected){
      label.textContent = remaining > 0 ? "follow-up" : "local listening";
    }
  }
  function setState(s){
    currentState = s || "idle";
    orb.className = "orb " + (s || "");
    label.textContent = states[s] || s || "—";
    renderUsage();
  }
  function line(who, text, cls){
    const d = document.createElement("div");
    d.className = "turn";
    d.innerHTML = `<div class="who ${who==="me"?"me":""}">${who==="me"?"you":"hermes"}</div><div class="${cls||""}"></div>`;
    d.lastChild.textContent = text;
    log.appendChild(d);
    log.scrollTop = log.scrollHeight;
  }
  function partial(text, turn){
    if (partialTurn !== turn){
      partialTurn = turn;
      partialNode = null;
    }
    if (!partialNode){
      partialNode = document.createElement("div");
      partialNode.className = "turn";
      partialNode.innerHTML = '<div class="who me">you · live</div><div></div>';
      log.appendChild(partialNode);
    }
    partialNode.lastChild.textContent = text;
    log.scrollTop = log.scrollHeight;
  }
  function clearPartial(){
    if (partialNode){ partialNode.remove(); }
    partialTurn = null;
    partialNode = null;
  }
  function setConn(on){
    connected = on;
    if (!on){ disarmTap(false); clearPttHeld(); turnIsManual = false; turnIsFollowup = false; followupUntil = 0; sttMode = null; sttTurn = null; paidAudioThisTurn = false; }
    dot.className = "dot" + (on ? " on" : "");
    connTxt.textContent = on ? "connected" : "disconnected";
    renderUsage();
  }

  function hasTurn(turn){ return turn !== undefined && turn !== null; }
  function sameTurn(a, b){ return hasTurn(a) && hasTurn(b) && String(a) === String(b); }
  function staleTurn(turn){
    if (!hasTurn(turn) || !hasTurn(lastPlaybackTurn)) return false;
    const current = Number(turn), previous = Number(lastPlaybackTurn);
    return Number.isFinite(current) && Number.isFinite(previous)
      ? current <= previous
      : sameTurn(turn, lastPlaybackTurn);
  }
  function sendJson(data){
    if (ws && ws.readyState === 1) ws.send(JSON.stringify(data));
  }
  function showInterrupt(show){ interruptBtn.classList.toggle("hidden", !show); }
  function clearReleaseTimer(){
    if (playback.releaseTimer){ clearTimeout(playback.releaseTimer); playback.releaseTimer = null; }
  }
  function revokeActiveUrl(){
    if (playback.activeUrl){ URL.revokeObjectURL(playback.activeUrl); playback.activeUrl = null; }
  }
  function disposeActiveAudio(){
    const audio = playback.active;
    playback.active = null;
    if (!audio) { revokeActiveUrl(); return; }
    audio.onended = null;
    audio.onerror = null;
    try { audio.pause(); } catch(e){}
    try { audio.removeAttribute("src"); audio.load(); } catch(e){}
    revokeActiveUrl();
  }
  function resetPlayback(releaseMic){
    clearReleaseTimer();
    playback.generation++;
    disposeActiveAudio();
    playback.mode = null;
    playback.turn = null;
    playback.nextSeq = 0;
    playback.awaiting = null;
    playback.queue.length = 0;
    playback.ended = false;
    playback.completionScheduled = false;
    showInterrupt(false);
    if (releaseMic){
      playing = false;
      interruptPendingTurn = null;
    }
  }
  function rejectProtocol(message){
    hint.textContent = message;
  }
  function markSpeaking(turn){
    if (hasTurn(turn)){
      if (staleTurn(turn) || (hasTurn(playback.turn) && !sameTurn(turn, playback.turn))){
        rejectProtocol("Stale audio response ignored.");
        return false;
      }
      speakingTurn = turn;
    }
    clearReleaseTimer();
    clearPttHeld();
    disarmTap(false);
    playing = true;
    showInterrupt(true);
    setState("speaking");
    return true;
  }
  function finishPlayback(status, errorText){
    if (!playback.mode || playback.completionScheduled) return;
    const turn = playback.turn;
    playback.completionScheduled = true;
    if (status === "failed"){
      resetPlayback(true);
      lastPlaybackTurn = turn;
      sendJson({type:"playback_done", turn, status:"failed"});
      setState("error");
      line("hermes", errorText || "Audio playback failed.", "err-line");
      hint.textContent = "Response playback failed.";
      return;
    }
    const generation = playback.generation;
    clearReleaseTimer();
    playback.releaseTimer = setTimeout(() => {
      if (playback.generation !== generation) return;
      playback.releaseTimer = null;
      playing = false;
      lastPlaybackTurn = turn;
      sendJson({type:"playback_done", turn, status:"completed"});
      resetPlayback(false);
      speakingTurn = null;
      if (running) setState("listening");
    }, 700);
  }
  function maybeFinishPlayback(){
    if (!playback.mode || playback.awaiting || playback.active || playback.queue.length) return;
    if (playback.mode === "segmented" && !playback.ended) return;
    finishPlayback("completed");
  }
  function failPlayback(message, generation){
    if (generation !== undefined && generation !== playback.generation) return;
    finishPlayback("failed", message);
  }
  function releaseInterruptedPlayback(delayMs){
    clearReleaseTimer();
    const generation = playback.generation;
    playback.releaseTimer = setTimeout(() => {
      if (playback.generation !== generation) return;
      playback.releaseTimer = null;
      playing = false;
      speakingTurn = null;
      if (running){
        setState("listening");
        hint.textContent = "Say what to add, or ask for a summary, without repeating the wake phrase";
      }
    }, Math.max(700, Number(delayMs) || 0));
  }
  function handleInterruptAck(msg, rejected){
    if (!sameTurn(msg.turn, interruptPendingTurn)){
      rejectProtocol("Stale interruption acknowledgement ignored.");
      return;
    }
    interruptPendingTurn = null;
    // The server has stopped producing audio. Keep capture muted through the
    // advertised speaker tail before returning the UI to listening.
    releaseInterruptedPlayback(rejected ? 700 : msg.echo_tail_ms);
  }
  function playNextAudio(){
    if (playback.active || !playback.queue.length || playback.completionScheduled) return;
    const data = playback.queue.shift();
    const generation = playback.generation;
    const blob = new Blob([data], {type:"audio/mpeg"});
    const url = URL.createObjectURL(blob);
    const audio = new Audio(url);
    playback.active = audio;
    playback.activeUrl = url;
    clearPttHeld();
    disarmTap(false);
    playing = true;
    audio.onended = () => {
      if (generation !== playback.generation || playback.active !== audio) return;
      playback.active = null;
      audio.onended = null;
      audio.onerror = null;
      try { audio.removeAttribute("src"); audio.load(); } catch(e){}
      URL.revokeObjectURL(url);
      playback.activeUrl = null;
      playNextAudio();
      maybeFinishPlayback();
    };
    audio.onerror = () => failPlayback("Response playback failed.", generation);
    try {
      const result = audio.play();
      if (result && typeof result.catch === "function"){
        result.catch(() => failPlayback("The browser refused audio playback.", generation));
      }
    } catch(e){
      failPlayback("The browser refused audio playback.", generation);
    }
  }
  function handleBinaryFrame(data){
    const pending = playback.awaiting;
    const turnsMatch = sameTurn(pending && pending.turn, playback.turn) ||
      (pending && pending.mode === "legacy" && !hasTurn(pending.turn) && !hasTurn(playback.turn));
    if (!pending || !playback.mode || !turnsMatch){
      rejectProtocol("Stale audio packet ignored.");
      return;
    }
    playback.awaiting = null;
    playback.queue.push(data);
    if (pending.mode === "segmented") playback.nextSeq++;
    playNextAudio();
  }
  function handleAudioStart(msg){
    if (!hasTurn(msg.turn) || staleTurn(msg.turn) || playback.mode){
      rejectProtocol("Invalid or stale audio response start.");
      return;
    }
    if (hasTurn(speakingTurn) && !sameTurn(msg.turn, speakingTurn)){
      rejectProtocol("Unexpected audio turn ignored.");
      return;
    }
    playback.mode = "segmented";
    playback.turn = msg.turn;
    playback.nextSeq = 0;
    playback.ended = false;
    playback.completionScheduled = false;
    markSpeaking(msg.turn);
  }
  function handleAudioChunk(msg){
    const seq = Number(msg.seq);
    if (playback.mode !== "segmented" || !sameTurn(msg.turn, playback.turn) ||
        !Number.isInteger(seq) || seq !== playback.nextSeq || playback.awaiting){
      rejectProtocol("Out-of-sequence audio segment ignored.");
      return;
    }
    playback.awaiting = {mode:"segmented", turn:msg.turn, seq};
  }
  function handleAudioEnd(msg){
    if (playback.mode !== "segmented" || !sameTurn(msg.turn, playback.turn) || playback.awaiting){
      rejectProtocol("Unexpected audio response end ignored.");
      return;
    }
    playback.ended = true;
    maybeFinishPlayback();
  }
  function handleLegacyAudio(msg){
    const turn = hasTurn(msg.turn) ? msg.turn : speakingTurn;
    if (playback.mode && playback.mode !== "legacy"){
      rejectProtocol("Legacy audio ignored during a segmented response.");
      return;
    }
    if (hasTurn(turn) && staleTurn(turn)){
      rejectProtocol("Stale legacy audio ignored.");
      return;
    }
    if (!playback.mode){
      playback.mode = "legacy";
      playback.turn = turn;
      playback.completionScheduled = false;
    } else if (playback.awaiting || playback.completionScheduled || playback.releaseTimer){
      rejectProtocol("Out-of-sequence legacy audio ignored.");
      return;
    }
    playback.awaiting = {mode:"legacy", turn:playback.turn};
    markSpeaking(playback.turn);
  }
  function handleJsonFrame(raw){
    let msg;
    try { msg = JSON.parse(raw); } catch { return; }
    if (!msg || typeof msg.type !== "string") return;
    if (playback.awaiting){
      rejectProtocol("Invalid audio response: expected a binary packet.");
      failPlayback("The server interrupted the audio sequence.");
      return;
    }
    switch (msg.type){
      case "state":
        if (msg.phrase) wakePhrase = msg.phrase;
        if (["listening", "transcribing", "thinking", "speaking", "error"].includes(msg.state)){
          disarmTap(false);
        }
        if (msg.state === "waking"){
          turnIsManual = false;
          turnIsFollowup = false;
          followupUntil = 0;
          sttMode = null;
          paidAudioThisTurn = false;
          sttTurn = msg.turn;
        }
        if ((msg.state === "waking" || msg.state === "recording") && typeof msg.followup === "boolean"){
          turnIsFollowup = msg.followup;
        }
        if ((msg.state === "waking" || msg.state === "recording") && typeof msg.manual === "boolean"){
          turnIsManual = msg.manual;
        }
        if (msg.state === "speaking"){
          markSpeaking(msg.turn);
        } else if (msg.state === "listening" && playback.mode){
          setState("speaking");
        } else {
          setState(msg.state);
        }
        if (msg.phrase && !tapArmed && connected){
          hint.textContent = `Say “${wakePhrase}” to talk.`;
        }
        break;
      case "stt_status":
        if (sameTurn(msg.turn, sttTurn) && ["waking", "recording", "transcribing"].includes(currentState)
            && (msg.mode === "realtime" || msg.mode === "local")){
          sttMode = msg.mode;
          if (msg.mode === "realtime") paidAudioThisTurn = true;
          renderUsage();
        }
        break;
      case "partial_transcript": partial(msg.text, msg.turn); break;
      case "transcript": clearPartial(); line("me", msg.text); break;
      case "reply": line("hermes", msg.text); break;
      case "audio_start": handleAudioStart(msg); break;
      case "audio_chunk": handleAudioChunk(msg); break;
      case "audio_end": handleAudioEnd(msg); break;
      case "audio": handleLegacyAudio(msg); break;
      case "fatal":
        disarmTap(false);
        if (playback.mode) failPlayback("Audio error: " + (msg.error || "fatal error"));
        setState("error"); line("hermes", "Fatal error: " + msg.error, "err-line");
        break;
      case "interrupt_ack": handleInterruptAck(msg, false); break;
      case "interrupt_rejected": handleInterruptAck(msg, true); break;
      case "followup":
        followupUntil = Date.now() + Math.max(0, Number(msg.seconds) || 0) * 1000;
        renderUsage();
        hint.textContent = msg.interrupted
          ? "Say what to add, or ask for a summary, without repeating the wake phrase"
          : `You can keep talking without the wake phrase for ${msg.seconds} seconds.`;
        break;
      case "pong": break;
    }
  }

  // —— capture: mic -> PCM 16k mono int16 ——
  async function startMic(){
    // ?raw=1 disables echo cancellation and noise suppression; phone
    // processing can make speech unintelligible to ASR.
    const raw = new URLSearchParams(location.search).get("raw") === "1";
    stream = await navigator.mediaDevices.getUserMedia({
      audio: raw
        ? { echoCancellation:false, noiseSuppression:false, autoGainControl:true, channelCount:1 }
        : { echoCancellation:true, noiseSuppression:true, autoGainControl:true, channelCount:1 }
    });
    if (raw) hint.textContent = "Raw mode active (no echo cancellation).";
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === "suspended") { try { await ctx.resume(); } catch(e){} }
    source = ctx.createMediaStreamSource(stream);
    processor = ctx.createScriptProcessor(4096, 1, 1);
    source.connect(processor);
    processor.connect(ctx.destination); // Required to keep the ScriptProcessor running.
    processor.onaudioprocess = e => {
      window.__frames = (window.__frames || 0) + 1;
      if (!running || !ws || ws.readyState !== 1) return;
      if (playing) return;   // Do not send the echo of our own response.
      const inp = e.inputBuffer.getChannelData(0);
      const out = downsample(inp, ctx.sampleRate, 16000);
      meterBar.style.width = Math.min(100, peak(out) * 260) + "%";
      ws.send(out.buffer);
    };
  }
  function downsample(buf, from, to){
    const ratio = from / to;
    const len = Math.floor(buf.length / ratio);
    const out = new Int16Array(len);
    for (let i = 0; i < len; i++){
      const j = i * ratio;
      const s = Math.max(-1, Math.min(1, buf[Math.floor(j)]));
      out[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
    }
    return out;
  }
  function peak(arr){
    let p = 0;
    for (let i = 0; i < arr.length; i++){ const v = Math.abs(arr[i]); if (v > p) p = v; }
    return p / 32768;
  }

  // —— websocket ——
  function connect(){
    clearReleaseTimer();
    resetPlayback(true);
    speakingTurn = null;
    try { if (ws) { ws.onclose = null; ws.close(); } } catch(e){}
    try {
      ws = new WebSocket(WS_URL);
    } catch(err){
      setConn(false);
      line("hermes", "WebSocket opening failed: " + err.message, "err-line");
      if (running) scheduleReconnect();
      return;
    }
    const socket = ws;
    socket.binaryType = "arraybuffer";
    socket.onopen = () => { if (ws !== socket) return; setConn(true); reconnectTries = 0; setState("listening"); };
    socket.onclose = () => {
      if (ws !== socket) return;
      resetPlayback(true);
      speakingTurn = null;
      setConn(false);
      if (running){
        setState("listening");                  // Reconnecting.
        hint.textContent = "Connection lost, retrying…";
      } else {
        setState("error");
      }
    };
    socket.onerror = () => {
      if (ws !== socket) return;
      setConn(false);
      line("hermes", "WebSocket error: connection to the bridge refused (reload the page)", "err-line");
    };
    socket.onmessage = ev => {
      if (ws !== socket) return;
      if (typeof ev.data === "string"){
        handleJsonFrame(ev.data);
      } else if (ev.data instanceof ArrayBuffer ||
                 (typeof Blob !== "undefined" && ev.data instanceof Blob)){
        handleBinaryFrame(ev.data);
      } else {
        rejectProtocol("Unsupported audio format ignored.");
      }
    };
  }
  function scheduleReconnect(){
    clearTimeout(reconnectTimer);
    reconnectTries++;
    reconnectTimer = setTimeout(connect, Math.min(15000, 1000 * reconnectTries));
  }
  function interruptPlayback(){
    if (!playing && !playback.mode) return;
    const turn = hasTurn(playback.turn) ? playback.turn : speakingTurn;
    if (!hasTurn(turn)) return;
    resetPlayback(false);
    lastPlaybackTurn = turn;
    interruptPendingTurn = turn;
    sendJson({type:"interrupt", turn});
    clearPttHeld();
    disarmTap(false);
    playing = true;
  }

  // —— wake lock: keep the screen on ——
  async function lockScreen(){
    try { wakeLock = await navigator.wakeLock.request("screen"); } catch(e){}
    document.addEventListener("visibilitychange", async () => {
      if (document.visibilityState === "visible" && running && !wakeLock){
        try { wakeLock = await navigator.wakeLock.request("screen"); } catch(e){}
      }
    });
  }

  async function start(){
    disarmTap(false);
    try {
      await startMic();
      await lockScreen();
      running = true;
      connect();
      startBtn.classList.add("hidden");
      stopBtn.classList.remove("hidden");
      pttBtn.classList.remove("hidden");
      tapBtn.classList.remove("hidden");
      talkPair.classList.remove("hidden");
      hint.textContent = wakePhrase ? `Listening. Say “${wakePhrase}”.` : "Connecting, loading the wake phrase…";
      setState("listening");
      keepalive = setInterval(() => {
        if (!ws || ws.readyState !== 1) return;
        ws.send(JSON.stringify({type:"ping"}));
        ws.send(JSON.stringify({
          type:"diag",
          ctx: ctx ? ctx.state : "none",
          rate: ctx ? ctx.sampleRate : 0,
          mic: stream ? stream.getAudioTracks().map(t => t.readyState + ":" + t.enabled).join(",") : "none",
          frames: window.__frames || 0,
          vis: document.visibilityState,
          raw: new URLSearchParams(location.search).get("raw") === "1",
        }));
      }, 5000);
    } catch(err){
      setState("error");
      line("hermes", "Microphone unavailable: " + err.message, "err-line");
      hint.textContent = "HTTPS or the authorized origin is needed (chrome://flags).";
    }
  }
  function stop(){
    disarmTap(false);
    clearPttHeld();
    running = false;
    clearInterval(keepalive);
    clearTimeout(reconnectTimer);
    resetPlayback(true);
    speakingTurn = null;
    try { processor && processor.disconnect(); source && source.disconnect(); } catch(e){}
    stream && stream.getTracks().forEach(t => t.stop());
    ctx && ctx.close();
    ws && ws.close();
    setConn(false); setState("idle");
    startBtn.classList.remove("hidden");
    stopBtn.classList.add("hidden");
    pttBtn.classList.add("hidden");
    tapBtn.classList.add("hidden");
    talkPair.classList.add("hidden");
    hint.textContent = wakePhrase ? `Say “${wakePhrase}” to talk. Keep the screen on and the phone charging.` : "Start listening to load the configured wake phrase.";
  }
  let keepalive = null;

  function armTap(){
    if (tapArmed || pttHeld || !running || !ws || ws.readyState !== 1 || playing || currentState !== "listening") return;
    tapArmed = true;
    tapBtn.classList.add("held");
    tapBtn.textContent = "Tap to stop";
    hint.textContent = "Tap again to send.";
    sendJson({type:"ptt", phase:"down"});
  }
  function disarmTap(sendUp){
    const wasArmed = tapArmed;
    tapArmed = false;
    tapBtn.classList.remove("held");
    tapBtn.textContent = "Tap to talk";
    if (wasArmed){
      if (sendUp) sendJson({type:"ptt", phase:"up"});
      hint.textContent = connected && wakePhrase ? `Say “${wakePhrase}” to talk.` : "";
    }
  }
  tapBtn.onclick = () => tapArmed ? disarmTap(true) : armTap();

  function clearPttHeld(){
    pttHeld = false;
    pttBtn.classList.remove("held");
    pttBtn.textContent = "Hold to talk";
  }
  function releasePtt(){
    if (!pttHeld) return;
    clearPttHeld();
    sendJson({type:"ptt", phase:"up"});
  }
  pttBtn.addEventListener("pointerdown", ev => {
    if (tapArmed || pttHeld || !running || !ws || ws.readyState !== 1 || playing || currentState !== "listening") return;
    disarmTap(false);
    ev.preventDefault();
    pttHeld = true;
    pttBtn.classList.add("held");
    pttBtn.textContent = "Release to send";
    pttBtn.setPointerCapture(ev.pointerId);
    sendJson({type:"ptt", phase:"down"});
  });
  pttBtn.addEventListener("pointerup", releasePtt);
  pttBtn.addEventListener("pointercancel", releasePtt);
  pttBtn.addEventListener("lostpointercapture", releasePtt);
  pttBtn.addEventListener("contextmenu", ev => ev.preventDefault());

  startBtn.onclick = start;
  stopBtn.onclick = stop;
  interruptBtn.onclick = interruptPlayback;
  setInterval(renderUsage, 1000);
  document.addEventListener("click", () => { if (ctx && ctx.state === "suspended") ctx.resume(); }, {once:false});
})();
</script>
<script>
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  async function refreshUsage(){
    try {
      const r = await fetch("usage"); if (!r.ok) return;
      const u = await r.json();
      const el = document.getElementById("monthUsage"); if (!el) return;
      el.textContent = `Month ${u.month}: ${u.turns} turns · ${u.realtime_min} min paid audio`
        + (u.est_eur != null ? " \u00b7 ~\u20ac" + u.est_eur : "");
    } catch(e){}
  }
  refreshUsage(); setInterval(refreshUsage, 60000);
</script>
